<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>RuneHub Rotation Helper</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="appconfig.json" id="alt1-appconfig" />
</head>
<body>
    <div id="panel">
        <div id="panel-header">
            <span id="boss-label">RuneHub Rotation</span>
            <div id="header-controls">
                <span id="step-counter"></span>
                <button id="reset-btn" title="Reset to step 1">⟳</button>
            </div>
        </div>

        <div id="boss-row">
            <select id="boss-select">
                <option value="">Auto-detect boss</option>
            </select>
        </div>

        <div id="setup-note"></div>

        <div id="status-row">
            <span id="status-text">Target a boss or select one above</span>
            <button id="start-btn">▶</button>
        </div>
    </div>
    <script src="dist/index.js"></script>
</body>
</html>
