<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>RuneHub Rotation Helper</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="appconfig.json" id="alt1-appconfig" />
</head>
<body>
    <div id="app">
        <div id="header">
            <span id="boss-name">No boss detected</span>
            <span id="phase-label"></span>
        </div>
        <div id="setup-note"></div>
        <div id="rotation-display">
            <div class="no-boss">Stand near a boss to load its rotation.</div>
        </div>
        <div id="status"></div>
    </div>
    <script src="dist/index.js"></script>
</body>
</html>
